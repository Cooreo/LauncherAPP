name: Build Android APK

on:
  push:
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest > build_test.log 2>&1; then
            cat build_test.log
            grep -E "(^e: |error:|FAILED|FAILURE:|Execution failed)" build_test.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          cat build_test.log

      - name: Build Release-Optimized APK (signed with persistent project keystore for in-place upgrades)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare releases/RoomLauncher-v3.1.4.apk
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/RoomLauncher-v3.1.4.apk
          ls -lh releases/RoomLauncher-v3.1.4.apk

      - name: Verify persistent signing certificate matches keystore & v3.1.3 (prevents package conflicts)
        run: |
          python3 - <<'EOF'
          import subprocess, hashlib, struct, sys

          cert_pem = subprocess.check_output([
              "openssl", "pkcs12", "-in", "app/roomlauncher-debug.keystore",
              "-passin", "pass:android", "-clcerts", "-nokeys"
          ])
          cert_der = subprocess.check_output(
              ["openssl", "x509", "-outform", "DER"], input=cert_pem
          )
          print("Expected persistent keystore cert SHA-256:", hashlib.sha256(cert_der).hexdigest())

          for apk in ["releases/RoomLauncher-v3.1.3.apk", "releases/RoomLauncher-v3.1.4.apk"]:
              with open(apk, "rb") as f:
                  data = f.read()
              eocd = data.rfind(b'PK\x05\x06')
              cd_offset = struct.unpack_from('<I', data, eocd + 16)[0]
              block_size = struct.unpack_from('<Q', data, cd_offset - 24)[0]
              block = data[cd_offset - 8 - block_size : cd_offset]
              if cert_der not in block:
                  print(f"::error::Signing cert mismatch in {apk}!")
                  sys.exit(1)
              print(f"Verified persistent signing cert in {apk} ✓")
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomLauncher-v3.1.4.apk
          path: releases/RoomLauncher-v3.1.4.apk

      - name: Commit compiled APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/RoomLauncher-v3.1.4.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build: add compiled releases/RoomLauncher-v3.1.4.apk [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "APK unchanged, skipping commit."
          fi
