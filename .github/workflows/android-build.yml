name: Build Android APK

on:
  push:
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest > build_test.log 2>&1; then
            cat build_test.log
            grep -E "(^e: |error:|FAILED|FAILURE:|Execution failed)" build_test.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          cat build_test.log

      - name: Build Release-Optimized APK (signed with debug keystore for seamless upgrades)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare releases/RoomLauncher-v2.3.1.apk
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/RoomLauncher-v2.3.1.apk
          ls -lh releases/RoomLauncher-v2.3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomLauncher-v2.3.1.apk
          path: releases/RoomLauncher-v2.3.1.apk

      - name: Commit compiled APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/RoomLauncher-v2.3.1.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build: add compiled releases/RoomLauncher-v2.3.1.apk [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "APK unchanged, skipping commit."
          fi
